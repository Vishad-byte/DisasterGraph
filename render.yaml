services:
  - type: web
    name: disastergraph
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "bash start.sh"
    healthCheckPath: "/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_MODE
        value: demo
      - key: ROUTING_PROVIDER
        value: osmnx
      - key: INGESTION_SERVICE_URL
        value: internal
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: anthropic/claude-3.5-sonnet
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ENABLE_BOT
        value: "false"
      - key: ENABLE_AGENT_DAEMON
        value: "false"
